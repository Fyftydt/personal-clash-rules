[YAML]
profile:
  store-selected: true
  store-fake-ip: true
udp: true
tcp-concurrent: true
tcp-fast-open: true
proxy-groups!:
- name: 🚀 节点选择
  type: select
  proxies:
  - 🇯🇵 日本优选
  - 🇭🇰 香港优选
  - DIRECT
  include-all: true
- name: 🇯🇵 日本优选
  type: select
  filter: (?i)JP|日本|Japan
  url: https://www.apple.com/library/test/success.html
  interval: 300
  tolerance: 50
  include-all: true
- name: 🇭🇰 香港优选
  type: select
  filter: (?i)HK|香港|HongKong|Hong Kong
  url: https://www.apple.com/library/test/success.html
  interval: 300
  tolerance: 50
  include-all: true
- name: 🎮 GAME
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
  include-all: true
- name: 🐋 DeepSeek
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
  include-all: true
- name: 🎵 Spotify
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
  include-all: true
- name: 🔍 Bing
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  include-all: true
- name: 🔍 YAHOO&AOL
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
  include-all: true
- name: 🍎 苹果服务
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  include-all: true
- name: 🪟 微软服务
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  include-all: true
- name: ☁️ iCloud
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  include-all: true
- name: ☁️ OneDrive
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
  include-all: true
- name: 🚀 Speedtest
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
  include-all: true
- name: 🎮 Steam CN
  type: select
  proxies:
  - DIRECT
  - 🚀 节点选择
  include-all: true
- name: 🎮 Steam 商店/聊天/工坊
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
  include-all: true
- name: 🚫 广告拦截
  type: select
  proxies:
  - REJECT
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🚀 节点选择
  - DIRECT
rule-providers!:
  reject:
    type: http
    behavior: domain
    interval: 86400
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/reject.txt
    path: ./ruleset/reject.yaml
  direct:
    type: http
    behavior: domain
    interval: 86400
    url: https://raw.githubusercontent.com/Loyalsoldier/clash-rules/release/direct.txt
    path: ./ruleset/direct.yaml
  proxy:
    type: http
    behavior: domain
